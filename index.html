<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone Pulse · Amazon US, every hour</title>
<style>
  :root {
    --navy: #130f35; --navy-2: #1e1a47; --mint: #23e6a8; --mint-d: #0e9f74; --mint-soft: #e4fbf3;
    --ink: #130f35; --muted: #5e5a7a; --soft: #f4f3f9; --line: #e4e2ee; --up: #0b7d5b; --down: #c2410c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #fff; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  .tnum { font-variant-numeric: tabular-nums; }
  .mono { font-family: "Roboto Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* hero */
  .hero { background: var(--navy); color: #fff; padding: 22px 0 34px; position: relative; overflow: hidden; }
  .hero::after { content: ""; position: absolute; width: 420px; height: 420px; border-radius: 50%; background: var(--navy-2); top: -220px; right: -140px; }
  .hero .wrap { position: relative; z-index: 1; }
  .brand { font-weight: 700; letter-spacing: .02em; }
  .brand span { color: var(--mint); }
  .hero h1 { font-size: clamp(30px, 7vw, 44px); line-height: 1.1; font-weight: 500; margin: 28px 0 14px; letter-spacing: -.01em; }
  .hero h1 em { font-style: normal; color: var(--mint); }
  .hero h1 { text-wrap: balance; }
  .live { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: #c9c6e3; }
  .live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 0 4px rgba(35, 230, 168, .2); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 26px; }
  .stat { background: var(--navy-2); border-radius: 14px; padding: 14px; }
  .stat b { display: block; font-size: 28px; font-weight: 500; color: var(--mint); line-height: 1.1; }
  .stat small { color: #c9c6e3; font-size: 13px; }

  /* sections */
  section { padding: 40px 0 8px; }
  .kicker { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .kicker::before { content: ""; width: 28px; height: 3px; background: var(--mint-d); border-radius: 2px; }
  h2 { font-size: 26px; font-weight: 500; margin: 8px 0 4px; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 15px; }

  /* top list */
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .item { display: grid; grid-template-columns: 44px 1fr auto; gap: 12px; align-items: center; padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; cursor: pointer; text-align: left; font: inherit; color: inherit; width: 100%; }
  .item:hover { border-color: var(--mint-d); }
  .item:focus-visible { outline: 3px solid var(--mint); outline-offset: 2px; }
  .rank { font-size: 22px; color: var(--mint-d); font-weight: 600; text-align: center; }
  .name { font-weight: 600; line-height: 1.3; }
  .meta { font-size: 13px; color: var(--muted); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tag { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; background: var(--soft); color: var(--muted); }
  .tag.prime { background: var(--mint-soft); color: #0b6e52; }
  .price { font-weight: 700; font-size: 17px; text-align: right; white-space: nowrap; }
  .rk { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .mv { font-size: 12px; font-weight: 700; white-space: nowrap; line-height: 1.2; }
  .mv.new { color: var(--ink); background: var(--mint-soft); border-radius: 999px; padding: 0 6px; }
  .mv.same { color: var(--muted); font-weight: 500; }
  .spark svg { display: block; }
  .ov-read { font-size: 14px; margin: 6px 0 2px; min-height: 21px; }
  .ov-read b { font-weight: 600; }
  .ov svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
  .ov .lbl { font-size: 11px; fill: var(--muted); font-family: inherit; }
  .ov .ttl { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 8px; }
  .seg { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 20px; }
  .seg[hidden] { display: none; }
  .more[hidden] { display: none !important; }
  .seg button { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 16px; font: inherit; cursor: pointer; color: var(--ink); min-width: 200px; }
  .seg button b { display: block; font-size: 15px; }
  .seg button small { color: var(--muted); font-size: 13px; }
  .seg button:hover { border-color: var(--mint-d); }
  .seg button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .seg button.on small { color: #c9c6e3; }
  .more { margin-top: 12px; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--ink); background: #fff; font: inherit; font-weight: 600; cursor: pointer; color: var(--ink); }

  /* changes */
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  @media (min-width: 640px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
  .tile { background: var(--soft); border-radius: 14px; padding: 14px 16px; }
  .tile b { display: block; font-size: 32px; font-weight: 500; line-height: 1.1; }
  .tile small { color: var(--muted); font-size: 14px; }
  .moves { margin-top: 18px; display: grid; gap: 8px; }
  .move { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; font-size: 15px; }
  .move .what { font-weight: 600; white-space: nowrap; }
  .up { color: var(--up); } .down { color: var(--down); }
  .h3 { font-size: 14px; font-weight: 700; color: var(--muted); margin: 18px 0 8px; }

  /* downloads */
  .dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn { padding: 14px; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; border: 1px solid var(--navy); }
  .btn.primary { background: var(--mint); border-color: var(--mint); color: var(--navy); }
  .btn.ghost { background: #fff; color: var(--navy); }

  /* phone layout first, desktop changes are in the 960px block below */
  .thead, .deliv, .spark { display: none; }
  .cg { display: block; }
  .cols { display: block; }

  footer { margin: 48px 0 0; padding: 22px 0 34px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }

  /* detail sheet */
  .scrim { position: fixed; inset: 0; z-index: 10; background: rgba(19, 15, 53, .45); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; z-index: 11; left: 0; right: 0; bottom: 0; max-height: 88vh; overflow-y: auto; background: #fff; border-radius: 20px 20px 0 0;
           transform: translateY(100%); transition: transform .25s; padding: 10px 20px 28px; }
  .sheet.on { transform: none; }
  @media (min-width: 760px) and (max-width: 959px) { .sheet { left: 50%; right: auto; width: 720px; margin-left: -360px; } }
  .grab { width: 40px; height: 4px; border-radius: 2px; background: var(--line); margin: 4px auto 14px; }
  .sheet h3 { margin: 0 0 4px; font-size: 20px; line-height: 1.25; }
  .close { float: right; border: 0; background: var(--soft); border-radius: 50%; width: 34px; height: 34px; font-size: 16px; cursor: pointer; color: var(--ink); }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 16px 0; }
  .field { background: var(--soft); border-radius: 12px; padding: 10px 12px; }
  .field.full { grid-column: 1 / -1; }
  .field small { display: block; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .field b { font-weight: 600; }
  .field p { margin: 4px 0 0; font-size: 14px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  .field dl { margin: 4px 0 0; font-size: 14px; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; }
  .field dt { color: var(--muted); }
  .field dd { margin: 0; }

  @media (min-width: 960px) {
    .wrap { max-width: 1160px; padding: 0 40px; }
    .hero { padding: 28px 0 56px; }
    .hero::after { width: 640px; height: 640px; top: -330px; right: -180px; }
    .hero-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 40px; align-items: end; margin-top: 56px; }
    .hero h1 { font-size: 56px; margin: 0 0 20px; }
    .live { font-size: 15px; }
    .stats { margin-top: 0; gap: 14px; }
    .stat { padding: 22px 16px; border-radius: 18px; }
    .stat b { font-size: 40px; }
    .stat small { font-size: 13px; white-space: nowrap; }
    section { padding: 64px 0 8px; }
    h2 { font-size: 34px; margin-top: 10px; }
    .sub { font-size: 16px; margin-bottom: 26px; }
    .kicker { font-size: 14px; }

    .thead, .item { display: grid; grid-template-columns: 64px 1fr 130px 220px 130px; gap: 16px; }
    .thead { padding: 0 20px 10px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
    .thead span:first-child { text-align: center; } .thead span:last-child { text-align: right; }
    .list { gap: 8px; }
    .item { padding: 16px 20px; align-items: center; transition: border-color .15s, box-shadow .15s; }
    .item:hover { box-shadow: 0 6px 20px rgba(19, 15, 53, .08); }
    .rank { font-size: 26px; }
    .name { font-size: 17px; }
    .deliv { display: block; font-size: 14px; color: var(--muted); }
    .spark { display: block; }
    .price { font-size: 19px; }
    .more { width: 320px; display: block; margin: 20px auto 0; }

    .cg { display: grid; grid-template-columns: 360px 1fr; gap: 40px; align-items: start; }
    .tiles { grid-template-columns: 1fr 1fr; gap: 14px; }
    .tile { padding: 22px 20px; border-radius: 18px; }
    .tile b { font-size: 44px; }
    .tile small { font-size: 15px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
    .h3 { margin-top: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
    .move { padding: 14px 16px; flex-direction: column; gap: 4px; }
    .move .what { font-size: 17px; }

    .dl { grid-template-columns: 260px 260px; }
    footer { margin-top: 72px; }

    /* detail panel slides in from the right */
    .sheet { left: auto; right: 0; top: 0; bottom: 0; width: 540px; max-height: none; border-radius: 24px 0 0 24px;
             transform: translateX(100%); padding: 28px 32px 40px; }
    .sheet.on { transform: none; }
    .grab { display: none; }
    .sheet h3 { font-size: 24px; margin-right: 44px; }
  }
  .amz { display: block; text-align: center; margin-top: 6px; padding: 12px; border-radius: 12px; background: var(--navy); color: #fff; text-decoration: none; font-weight: 700; }
</style>

<header class="hero">
  <div class="wrap">
    <div class="brand">iPhone <span>Pulse</span></div>
    <div class="hero-grid">
      <div>
        <h1>The top 100 iPhones on Amazon US, <em>every hour.</em></h1>
        <div class="live" id="live"></div>
      </div>
      <div class="stats" id="stats"></div>
    </div>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="kicker">Right now</div>

    <ul class="list" id="list"></ul>
    <button class="more" id="more"></button>
  </section>

  <section id="changes">
    <div class="kicker">Overnight</div>
    <h2>What changed</h2>
    <p class="sub" id="span"></p>
    <div class="cg">
      <div class="tiles" id="tiles"></div>
      <div class="cols">
        <div><div class="h3">Biggest moves</div><div class="moves" id="moves"></div></div>
        <div><div class="h3">Biggest price changes</div><div class="moves" id="prices"></div></div>
      </div>
    </div>
  </section>

  <section>
    <div class="kicker">Your data</div>
    <h2>Take it with you</h2>
    <p class="sub" id="dl-sub"></p>
    <div class="dl">
      <button class="btn primary" id="dl-csv">Download CSV</button>
      <button class="btn ghost" id="dl-json">Download JSON</button>
    </div>
  </section>

  <footer id="foot"></footer>
</main>

}
function ovChart(s) {
  const { W, H, L, R, T: Tp, B } = OV, sc = scale(s.vals, s.invert);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.name} through the night">
    <line x1="${L}" x2="${W - R}" y1="${Tp}" y2="${Tp}" stroke="var(--line)"/><line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>
    <text class="lbl" x="${L - 8}" y="${Tp + 4}" text-anchor="end">${s.fmt(sc.top)}</text>
    <text class="lbl" x="${L - 8}" y="${H - B + 4}" text-anchor="end">${s.fmt(sc.bottom)}</text>
    <path d="${path(s.vals, sc.x, sc.y)}" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="xh" y1="${Tp}" y2="${H - B}" stroke="var(--muted)" stroke-width="1"/>
    <circle class="dot" r="4" fill="var(--navy)" stroke="#fff" stroke-width="2"/>
  </svg>`;
}
function overnight(l) {
  const h = T && T.rank[l.asin];
  if (!h) return "";
  const p = T.price[l.asin], n = h.length;
  const series = [{ name: "Rank", vals: h, invert: true, fmt: (v) => "#" + Math.round(v) }];
  if (p.some((v) => v != null)) series.push({ name: "Price", vals: p, invert: false, fmt: (v) => "$" + Math.round(v) });
  const read = (i) => `<b>${hour(T.times[i])}</b> · ${h[i] != null ? "rank #" + h[i] : "not in the top 100"}`
    + (series[1] ? " · " + (p[i] != null ? money(p[i]) : "no price") : "");
  setTimeout(() => wireOvernight(series, n, read), 0);
  return `<div class="field full ov"><small>Overnight · ${hour(T.times[0])} → ${hour(T.times[n - 1])}</small>
    <div class="ov-read" id="ov-read"></div>
    ${series.map((s) => `<div class="ttl">${s.name}</div>${ovChart(s)}`).join("")}</div>`;
}
function wireOvernight(series, n, read) {
  const svgs = [...document.querySelectorAll(".ov svg")];
  const show = (i) => {
    $("#ov-read").innerHTML = read(i);
    svgs.forEach((svg, k) => {
      const s = series[k], sc = scale(s.vals, s.invert), x = sc.x(i), v = s.vals[i];
      const xh = svg.querySelector(".xh"), dot = svg.querySelector(".dot");
      xh.setAttribute("x1", x); xh.setAttribute("x2", x);
      dot.setAttribute("visibility", v == null ? "hidden" : "visible");
      if (v != null) { dot.setAttribute("cx", x); dot.setAttribute("cy", sc.y(v)); }
    });
  };
  const pick = (e) => {
    const r = e.currentTarget.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width * OV.W;
    show(Math.max(0, Math.min(n - 1, Math.round((fx - OV.L) / (OV.W - OV.L - OV.R) * (n - 1)))));
  };
  svgs.forEach((svg) => {
    svg.addEventListener("pointermove", pick);
    svg.addEventListener("pointerdown", pick);  // a tap on a phone
    svg.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") show(n - 1); });
  });
  show(n - 1);  // the latest hour until you hover
}

/* top list */
let showAll = false;
function renderList() {
  const rows = showAll ? L : L.slice(0, 10);
  $("#top-title").textContent = showAll ? `All ${L.length} on Amazon` : "Top 10 on Amazon";
  $("#list").innerHTML = rows.map((l, i) => `<li><button class="item" data-i="${i}">
      <span class="rk"><span class="rank mono">${l.rank}</span>${badge(l)}</span>
      <span><span class="name">${esc(short(l.title))}</span>
        <span class="meta"><span class="tag">${l.renewed ? "Renewed" : "New"}</span>${l.prime ? '<span class="tag prime">Prime</span>' : ""}${l.sponsored ? '<span class="tag">Sponsored</span>' : ""}</span></span>
      <span class="spark">${spark(l)}</span>
      <span class="deliv">${esc(delivery(l) || "–")}</span>
      <span class="price tnum">${l.price != null ? money(l.price) : '<span class="tag">No offer</span>'}</span>
    </button></li>`).join("");
  $("#top-sub").textContent = !T ? "Tap or click any phone for all 7 fields."
    : `▲▼ = places gained or lost ${key === "overnight" ? "overnight" : `since the overnight run (${when(SRC.overnight.run.started_at)})`}. Tap any phone for all 7 fields and its night.`;
  $("#more").textContent = showAll ? "Show top 10 only" : `Show all ${L.length}`;
  $("#more").hidden = L.length <= 10;
  $("#list").querySelectorAll(".item").forEach((b) => b.addEventListener("click", () => openSheet(rows[+b.dataset.i])));
}
$("#more").addEventListener("click", () => { showAll = !showAll; renderList(); if (!showAll) $("#list").scrollIntoView({ block: "start" }); });

/* detail sheet: the 7 fields */
function openSheet(l) {
  const specs = Object.entries(l.details).filter(([k]) => !/asin|customer_reviews|best_sellers|date_first/i.test(k)).slice(0, 6);
  $("#sheet").innerHTML = `<div class="grab"></div>
    <button class="close" id="s-close" aria-label="Close">✕</button>
    <small class="mono" style="color:var(--mint-d);font-weight:600">#${l.rank} OF ${L.length}</small>
    <h3 id="s-title">${esc(short(l.title))}</h3>
    <div class="fields">
      <div class="field"><small>Price</small><b class="tnum">${money(l.price)}</b></div>
      <div class="field"><small>Search position</small><b>#${l.search_position} on the page</b></div>
      <div class="field"><small>Prime</small><b>${l.prime ? "Yes" : "No"}</b></div>
      <div class="field"><small>Placement</small><b>${l.sponsored ? "Sponsored" : "Organic"}</b></div>
      <div class="field full"><small>Delivery to ${esc(RUN.parameters.geo_location)}</small><b>${esc(delivery(l) || "Not offered right now")}</b></div>
      <div class="field full"><small>Description</small><p>${esc(l.description || "Not on the page")}</p></div>
      ${overnight(l)}
      ${specs.length ? `<div class="field full"><small>Specs</small><dl>${specs.map(([k, v]) => `<dt>${esc(k.replace(/_/g, " "))}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>` : ""}
    </div>
    <a class="amz" href="${esc(l.url)}" target="_blank" rel="noopener">Open on Amazon ↗</a>`;
  $("#sheet").classList.add("on"); $("#scrim").classList.add("on");
  $("#s-close").addEventListener("click", closeSheet); $("#s-close").focus();
}
function closeSheet() { $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on"); }
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSheet(); });

/* what changed */
if (!CH) {
  $("#changes").hidden = true;
} else {
  $("#span").textContent = `${when(CH.from)} → ${when(CH.to)} · ${CH.runs} hourly runs`;
  $("#tiles").innerHTML = [[CH.moved, "changed rank"], [CH.price_changes, "changed price"], [CH.new, "new in the top 100"], [CH.dropped, "dropped out"]]
    .map(([n, t]) => `<div class="tile"><b class="tnum">${n}</b><small>${t}</small></div>`).join("");
  $("#moves").innerHTML = CH.top_moves.map((m) => `<div class="move"><span>${esc(short(m.title))}</span>
    <span class="what ${m.to < m.from ? "up" : "down"} tnum">#${m.from} → #${m.to}</span></div>`).join("");
  $("#prices").innerHTML = CH.top_prices.map((p) => `<div class="move"><span>${esc(short(p.title))}</span>
    <span class="what ${p.to < p.from ? "up" : "down"} tnum">${money(p.from)} → ${money(p.to)}</span></div>`).join("");
}

/* downloads */
function download(name, type, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("#dl-json").addEventListener("click", () => download(`iphones-${RUN.run_id}.json`, "application/json", JSON.stringify({ run: RUN, listings: L }, null, 2)));
$("#dl-csv").addEventListener("click", () => {
  const cols = ["rank", "search_position", "sponsored", "asin", "title", "price", "prime", "condition", "delivery", "url"];
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = L.map((l) => cols.map((c) => cell(c === "delivery" ? delivery(l) : l[c])).join(","));
  download(`iphones-${RUN.run_id}.csv`, "text/csv", [cols.join(","), ...lines].join("\n"));
});

renderHero();
setSource(DATA.latest ? "latest" : "overnight");
</script>
</body>
