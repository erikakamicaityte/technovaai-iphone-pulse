/* overnight movement */
const hour = (iso) => new Date(iso).toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
function move(l) {  // overnight view: first vs last hourly run. Latest view: last hourly run vs the latest run
  if (!T) return null;
  const h = T.rank[l.asin];
  const from = h ? (key === "overnight" ? h[0] : h[h.length - 1]) : null;
  if (from == null) return { cls: "new", text: "New", title: key === "overnight" ? "New in the top 100 overnight" : "Not in the top 100 at the end of the overnight run" };
  const d = from - l.rank, when = key === "overnight" ? "overnight" : "since the overnight run";
  if (!d) return { cls: "same", text: "–", title: `Same rank ${when}` };
  return { cls: d > 0 ? "up" : "down", text: `${d > 0 ? "▲" : "▼"} ${Math.abs(d)}`, title: `${d > 0 ? "Up" : "Down"} ${Math.abs(d)} ${Math.abs(d) === 1 ? "place" : "places"} ${when} (was #${from})` };
}
const badge = (l) => { const m = move(l); return m ? `<span class="mv ${m.cls}" title="${m.title}">${m.text}</span>` : ""; };

// line segments for a series with gaps (null = not in the top 100 that hour)
function path(vals, x, y) {
  let d = "", on = false;
  vals.forEach((v, i) => { if (v == null) { on = false; return; } d += `${on ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`; on = true; });
  return d;
}
function spark(l) {
  const h = T && T.rank[l.asin];
  if (!h) return "";
  const W = 120, H = 32, pad = 5, vals = h.filter((v) => v != null);
  const lo = Math.min(...vals), hi = Math.max(...vals), mid = (lo + hi) / 2, half = Math.max(5, (hi - lo) / 2);  // at least 10 places tall, so ±1 looks small
  const x = (i) => pad + i * (W - 2 * pad) / (h.length - 1), y = (v) => pad + (v - (mid - half)) / (2 * half) * (H - 2 * pad);  // rank 1 at the top
  const last = h.length - 1, end = h[last] != null ? `<circle cx="${x(last)}" cy="${y(h[last])}" r="4" fill="var(--navy)" stroke="#fff" stroke-width="2"/>` : "";
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Rank overnight: #${vals[0]} to #${vals[vals.length - 1]}">
    <path d="${path(h, x, y)}" fill="none" stroke="#8c89a6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${end}</svg>`;
}

/* detail sheet: rank and price through the night, one chart each; hovering shows one hour */
const OV = { W: 480, H: 96, L: 52, R: 14, T: 10, B: 10 };
function scale(vals, invert) {
  const ok = vals.filter((v) => v != null);
  let lo = Math.min(...ok), hi = Math.max(...ok);
  if (hi - lo < (invert ? 4 : 1)) { const m = (hi + lo) / 2, sp = invert ? 2 : 0.5; lo = m - sp; hi = m + sp; }
  if (invert) lo = Math.max(1, lo);
  const x = (i) => OV.L + i * (OV.W - OV.L - OV.R) / (vals.length - 1);
  const y = (v) => OV.T + (invert ? v - lo : hi - v) / (hi - lo) * (OV.H - OV.T - OV.B);  // rank 1 at the top, highest price at the top
  return { x, y, top: invert ? lo : hi, bottom: invert ? hi : lo };
}
function ovChart(s) {
  const { W, H, L, R, T: Tp, B } = OV, sc = scale(s.vals, s.invert);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${s.name} through the night">
    <line x1="${L}" x2="${W - R}" y1="${Tp}" y2="${Tp}" stroke="var(--line)"/><line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="var(--line)"/>
    <text class="lbl" x="${L - 8}" y="${Tp + 4}" text-anchor="end">${s.fmt(sc.top)}</text>
    <text class="lbl" x="${L - 8}" y="${H - B + 4}" text-anchor="end">${s.fmt(sc.bottom)}</text>
    <path d="${path(s.vals, sc.x, sc.y)}" fill="none" stroke="var(--navy)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <line class="xh" y1="${Tp}" y2="${H - B}" stroke="var(--muted)" stroke-width="1"/>
    <circle class="dot" r="4" fill="var(--navy)" stroke="#fff" stroke-width="2"/>
  </svg>`;
}
function overnight(l) {
  const h = T && T.rank[l.asin];

  const p = T.price[l.asin], n = h.length;
  const series = [{ name: "Rank", vals: h, invert: true, fmt: (v) => "#" + Math.round(v) }];
  if (p.some((v) => v != null)) series.push({ name: "Price", vals: p, invert: false, fmt: (v) => "$" + Math.round(v) });
  const read = (i) => `<b>${hour(T.times[i])}</b> · ${h[i] != null ? "rank #" + h[i] : "not in the top 100"}`
    + (series[1] ? " · " + (p[i] != null ? money(p[i]) : "no price") : "");
  setTimeout(() => wireOvernight(series, n, read), 0);
  return `<div class="field full ov"><small>Overnight · ${hour(T.times[0])} → ${hour(T.times[n - 1])}</small>

function wireOvernight(series, n, read) {
  const svgs = [...document.querySelectorAll(".ov svg")];

    $("#ov-read").innerHTML = read(i);
    svgs.forEach((svg, k) => {
      const s = series[k], sc = scale(s.vals, s.invert), x = sc.x(i), v = s.vals[i];

    svg.addEventListener("pointerdown", pick);  // a tap on a phone
    svg.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") show(n - 1); });

}

/* the data as a table, with the same columns as the CSV */
const COLS = { rank: "Rank", search_position: "Position", sponsored: "Sponsored", asin: "ASIN", title: "Title",
  price: "Price", prime: "Prime", condition: "Condition", delivery: "Delivery", url: "Link" };
const NUM_COLS = ["rank", "search_position", "price"];
const cellValue = (l, c) => (c === "delivery" ? delivery(l) : l[c]);
function cellHtml(l, c) {
  const v = cellValue(l, c);
  if (v == null || v === "") return "–";
  if (c === "url") return `<a href="${esc(v)}" target="_blank" rel="noopener">Amazon ↗</a>`;
  if (c === "price") return money(v);
  if (typeof v === "boolean") return v ? "Yes" : "No";
  return esc(v);
}
function renderTable() {
  const cls = (c) => (NUM_COLS.includes(c) ? "num" : c);
  $("#tbl").innerHTML = `<table><thead><tr>${Object.entries(COLS).map(([c, name]) => `<th class="${cls(c)}">${name}</th>`).join("")}</tr></thead>
    <tbody>${L.map((l) => `<tr>${Object.keys(COLS).map((c) => `<td class="${cls(c)}">${cellHtml(l, c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}

/* downloads */
function download(name, type, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
$("#dl-json").addEventListener("click", () => download(`iphones-${RUN.run_id}.json`, "application/json", JSON.stringify({ run: RUN, listings: L }, null, 2)));
$("#dl-csv").addEventListener("click", () => {
  const cols = Object.keys(COLS);
  const cell = (v) => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const lines = L.map((l) => cols.map((c) => cell(cellValue(l, c))).join(","));
  download(`iphones-${RUN.run_id}.csv`, "text/csv", [cols.join(","), ...lines].join("\n"));
});

renderHero();
setSource(DATA.latest ? "latest" : "overnight");
</script>
